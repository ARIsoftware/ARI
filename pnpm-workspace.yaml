allowBuilds:
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

# Security floors for transitive dependencies (pnpm >=10 reads overrides from
# this file; the pnpm.overrides block in package.json is ignored).
overrides:
  sharp: '>=0.35.0'
  fast-xml-parser: '>=5.5.6'
  minimatch: '>=9.0.7'
  'ajv@<7': '>=6.14.0'
  flatted: '>=3.4.2'
  picomatch: '>=4.0.4'
  lodash: '>=4.18.0'
  defu: '>=6.1.5'
  uuid: '>=14.0.0'
  esbuild: '>=0.28.1'
  postcss: '>=8.5.14'
  kysely: '>=0.28.17'
  fast-xml-builder: '>=1.1.7'
  dompurify: '>=3.4.11'
  form-data: '>=4.0.6'
  js-yaml: '>=4.2.0 <5.0.0'
  'ws@<7.5.11': '>=7.5.11 <8.0.0'
  'undici@<6.27.0': '>=6.27.0 <7.0.0'
