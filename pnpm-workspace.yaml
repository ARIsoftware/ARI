allowBuilds:
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

# Security floors for transitive dependencies (pnpm >=10 reads overrides from
# this file; the pnpm.overrides block in package.json is ignored).
overrides:
  sharp: '>=0.35.0'
  fast-xml-parser: '>=5.5.6'
  minimatch: '>=9.0.7'
  'ajv@<7': '>=6.14.0'
  flatted: '>=3.4.2'
  picomatch: '>=4.0.4'
  lodash: '>=4.18.0'
  defu: '>=6.1.5'
  uuid: '>=14.0.0'
  esbuild: '>=0.28.1'
  postcss: '>=8.5.23 <9.0.0'
  kysely: '>=0.28.17'
  fast-xml-builder: '>=1.1.7'
  dompurify: '>=3.4.13'
  form-data: '>=4.0.6'
  js-yaml: '>=4.3.1 <5.0.0'
  'ws@<7.5.11': '>=7.5.11 <8.0.0'
  'undici@<6.28.0': '>=6.28.0 <7.0.0'
  fast-uri: '>=3.1.6 <4.0.0'
  'nanoid@<4.0.0': '>=3.3.18 <4.0.0'
  'nanoid@>=4.0.0': '>=5.1.16 <6.0.0'
  protobufjs: '>=7.6.5 <8.0.0'
  'brace-expansion@>=4.0.0': '>=5.0.9 <6.0.0'
  '@opentelemetry/core': '>=2.9.0 <3.0.0'
  '@opentelemetry/propagator-jaeger': '>=2.9.0 <3.0.0'
  'fflate@<0.7.0': '>=0.6.11 <0.7.0'
  '@faker-js/faker': '>=10.5.0 <11.0.0'
  postcss-selector-parser: '>=6.1.3 <7.0.0'
  browserslist: '>=4.28.7 <5.0.0'
