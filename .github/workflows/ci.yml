name: CI
on:
  push:
    branches: [main]
  pull_request:

# Minimal token scope — this workflow only checks out and builds/tests.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history and tags. tests/unit/ari-cli/upgrade-paths.lab.test.ts
          # takes every released updater out of the release tags and runs it
          # against today's code; a shallow checkout has no tags, and that
          # suite fails in CI rather than silently testing nothing.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Generate lib/generated/* and the schema barrel (same as predev) —
      # typecheck and tests need them, and a fresh checkout doesn't have them.
      - run: pnpm generate-module-registry
      - run: pnpm generate-openapi
      - run: pnpm typecheck
      # Report-only for now: surfaces ESLint findings in the PR log without
      # failing CI while the initial backlog is burned down. To make it a hard
      # gate later, just drop `continue-on-error`.
      - name: Lint (report-only)
        run: pnpm lint
        continue-on-error: true
      - run: pnpm test:coverage
      # The test suite already ran in test:coverage, so skip the in-build
      # test-report generation (prebuild) to avoid running the whole suite a
      # second time. Vercel builds don't set this, so production still generates
      # a fresh report.
      - run: pnpm build
        env:
          ARI_SKIP_TEST_REPORT: '1'
